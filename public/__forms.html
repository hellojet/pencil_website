<!-- Hidden form for Netlify Forms bot detection at build time -->
<form name="inquiry" netlify netlify-honeypot="bot-field" hidden>
  <input name="form-name" type="hidden" />
  <input name="bot-field" />
  <input name="name" />
  <input name="email" />
  <input name="company" />
  <input name="product" />
  <input name="quantity" />
  <textarea name="message"></textarea>
</form>
